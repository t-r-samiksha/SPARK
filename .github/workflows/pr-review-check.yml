name: PR review check

# Belt-and-suspenders check that a PR has at least one approving review.
# The primary enforcement should be GitHub's native branch protection
# ("Require approvals" >= 1 on dev and main) — this workflow gives a
# visible, re-runnable status check for the same rule.

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  require-approval:
    name: Require 1 approving review
    runs-on: ubuntu-latest
    steps:
      - name: Check approving review count
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const approvals = new Map();
            for (const review of reviews) {
              if (review.state === 'APPROVED') {
                approvals.set(review.user.id, true);
              } else if (review.state === 'CHANGES_REQUESTED' || review.state === 'DISMISSED') {
                approvals.delete(review.user.id);
              }
            }

            if (approvals.size < 1) {
              core.setFailed('This PR needs at least 1 approving review before it can merge.');
            } else {
              console.log(`Found ${approvals.size} approving review(s).`);
            }
