name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  android:
    name: Android (wallet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for android project
        id: check
        run: |
          if [ -f "android/build.gradle" ] || [ -f "android/build.gradle.kts" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK 17
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle build & test
        if: steps.check.outputs.exists == 'true'
        working-directory: android
        run: ./gradlew build test --no-daemon
      - name: No android project yet
        if: steps.check.outputs.exists == 'false'
        run: echo "android/ has no Gradle project yet — skipping."

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for backend project
        id: check
        run: |
          if [ -f "backend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install & test
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present
      - name: No backend project yet
        if: steps.check.outputs.exists == 'false'
        run: echo "backend/ has no package.json yet — skipping."

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for dashboard project
        id: check
        run: |
          if [ -f "dashboard/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install, lint, test, build
        if: steps.check.outputs.exists == 'true'
        working-directory: dashboard
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present
      - name: No dashboard project yet
        if: steps.check.outputs.exists == 'false'
        run: echo "dashboard/ has no package.json yet — skipping."

  # Single required status check that fans in the three jobs above, so branch
  # protection on `dev`/`main` only needs to require this one job.
  ci-green:
    name: CI green
    needs: [android, backend, dashboard]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed."
          exit 1
